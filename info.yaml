# Tiny Tapeout project information
project:
  title:        "Simple Single-Cycle RISC-V Core"
  author:       "ahmed"
  discord:      ""
  description:  "A minimal single-cycle RISC-V CPU with an 8-bit datapath, 16 registers, and an internal program counter."
  language:     "Verilog"
  clock_hz:     0

  # How many tiles your design occupies?
  tiles: "1x1"

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_example"

  # List of your project's source files.
  source_files:
 source_files:
  - "project.v"
  - "TOP.v"
  - "PC.v"
  - "Instruction_memory.v"
  - "Control_Unit.v"
  - "Sign_extend.v"
  - "Register_File.v"
  - "Mux.v"
  - "ALU.v"
  - "Data_Memory.v"

# The pinout of your project.
pinout:

  # Inputs
  ui[0]: "unused"
  ui[1]: "unused"
  ui[2]: "unused"
  ui[3]: "unused"
  ui[4]: "unused"
  ui[5]: "Execute"
  ui[6]: "output_select[0]"
  ui[7]: "output_select[1]"

  # Outputs
  uo[0]: "selected_data[0]"
  uo[1]: "selected_data[1]"
  uo[2]: "selected_data[2]"
  uo[3]: "selected_data[3]"
  uo[4]: "selected_data[4]"
  uo[5]: "selected_data[5]"
  uo[6]: "selected_data[6]"
  uo[7]: "selected_data[7]"

  # Bidirectional pins
  uio[0]: "ReadRegAddr[0]"
  uio[1]: "ReadRegAddr[1]"
  uio[2]: "ReadRegAddr[2]"
  uio[3]: "ReadRegAddr[3]"
  uio[4]: "ReadRegAddr[4]"
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
